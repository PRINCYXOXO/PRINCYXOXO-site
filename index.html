<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRINCYXOXO</title>
  <script src="https://tailwindcss.com"></script>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    body { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-200 min-h-screen">

  <!-- Header Area -->
  <header class="text-center py-12 border-b border-neutral-800 tracking-widest">
    <h1 class="text-5xl font-light uppercase text-neutral-100 tracking-wider">princyxoxo</h1>
    <p class="text-xs uppercase mt-2 text-amber-600 tracking-[0.3em]">The Scandalous Lives of My Inner Circle</p>
  </header>

  <main class="max-w-xl mx-auto px-4 py-8">
    
    <!-- ANONYMOUS TIP BOX -->
    <section class="bg-neutral-900 border border-neutral-800 p-6 rounded-md mb-12 shadow-2xl">
      <h2 class="text-lg font-semibold mb-4 text-amber-600">Spotted something? Send a tip.</h2>
      <form id="tipForm" class="space-y-4">
        <div>
          <label class="block text-[10px] uppercase tracking-widest mb-1 text-neutral-400">Location</label>
          <input id="tipLocation" type="text" required class="w-full bg-neutral-950 border border-neutral-800 rounded p-2 text-neutral-200 text-xs focus:outline-none focus:border-amber-600" placeholder="e.g., The school cafeteria, the party">
        </div>
        <div>
          <label class="block text-[10px] uppercase tracking-widest mb-1 text-neutral-400">The Gossip</label>
          <textarea id="tipContent" required rows="3" class="w-full bg-neutral-950 border border-neutral-800 rounded p-3 text-neutral-200 text-xs focus:outline-none focus:border-amber-600" placeholder="Give Princy the dirty details..."></textarea>
        </div>
        <button type="submit" class="w-full bg-amber-700 hover:bg-amber-600 text-neutral-950 font-bold py-2 rounded text-xs uppercase tracking-widest transition">Send Blast</button>
      </form>
    </section>

    <!-- THE SCANDAL FEED -->
    <section id="blastFeed" class="space-y-6">
      
      <!-- Default Post 1 -->
      <article class="bg-neutral-900 border border-neutral-800 p-6 rounded-md shadow-lg">
        <div class="flex justify-between items-center mb-3 text-[10px] uppercase text-neutral-500 tracking-wider">
          <span>Spotted: The Courtyard</span>
          <span>1 hour ago</span>
        </div>
        <p class="text-neutral-300 leading-relaxed text-sm mb-4 italic">
          Spotted: Someone left a cryptic note in a locker before third period. Looks like a certain secret is finally about to burst into the open.
        </p>
        <span class="block text-right font-semibold text-amber-600 text-xs">xoxo, PRINCYXOXO</span>
      </article>

    </section>
  </main>

  <script>
    // This handles temporary browser-only submissions for now
    document.getElementById('tipForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const locationInput = document.getElementById('tipLocation');
      const contentInput = document.getElementById('tipContent');
      const feed = document.getElementById('blastFeed');

      const newCard = `
        <article class="bg-neutral-900 border border-neutral-800 p-6 rounded-md shadow-lg">
          <div class="flex justify-between items-center mb-3 text-[10px] uppercase text-neutral-500 tracking-wider">
            <span>Spotted: ${locationInput.value}</span>
            <span>Just Now</span>
          </div>
          <p class="text-neutral-300 leading-relaxed text-sm mb-4 italic">${contentInput.value}</p>
          <span class="block text-right font-semibold text-amber-600 text-xs">xoxo, PRINCYXOXO</span>
        </article>
      `;

      feed.insertAdjacentHTML('afterbegin', newCard);
      locationInput.value = '';
      contentInput.value = '';
    });
  </script>
</body>
</html>
