name: Publish Gossip Blast
on:
  repository_dispatch:
    types: [publish_blast]

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Gossip Card into HTML
        run: |
          TITLE="${{ github.event.client_payload.title }}"
          CONTENT="${{ github.event.client_payload.content }}"
          
          # Create the HTML structure for the new post card
          NEW_POST="<!-- NEW POST -->\n        <article>\n          <h2>${TITLE,,}</h2>\n          <div class=\"file-under\">Filed under: Live Feed > Exclusive > Blast</div>\n          <p>${CONTENT}</p>\n          <span class=\"signature\">xoxo, PRINCYXOXO</span>\n        </article>"
          
          # Inject it right below the blastFeed section tag line
          sed -i "s|<section id=\"blastFeed\">|<section id=\"blastFeed\">\n$NEW_POST|g" index.html

      - name: Commit and Push Changes back to Repository
        run: |
          git config --global user.name "PRINCYXOXO"
          git config --global user.email "testacc78999@gmail.com"
          git add index.html
          git commit -m "👑 Princy launched live blast via automated desk queue"
          git push
