.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-top: 10px;
  text-align: center;
  font-size: 11px;
}

.cal-day-label {
  font-weight: bold;
  color: #d23f77;
  padding-bottom: 4px;
}

.cal-cell {
  padding: 5px 0;
  color: #5c0e2e;
  border-radius: 4px;
}

.cal-cell.today {
  background-color: #f8c5d8;
  color: #d23f77;
  font-weight: bold;
  border: 1px solid #d23f77;
}

/* Cbox Container */
.cbox-container {
  background-color: #ffffff;
  border: 2px solid #d23f77;
  border-radius: 12px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 280px;
  box-shadow: 0 4px 10px rgba(210, 63, 119, 0.15);
}

.cbox-title {
  font-family: 'Bodoni Moda', serif;
  font-size: 14px;
  font-weight: bold;
  color: #d23f77;
  text-align: center;
  border-bottom: 1px dashed #f0a3c2;
  padding-bottom: 6px;
  margin-bottom: 8px;
}

.cbox-messages {
  flex: 1;
  max-height: 220px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-right: 4px;
  margin-bottom: 10px;
}

.cbox-msg-item {
  background-color: #fff5f8;
  border: 1px solid #f0a3c2;
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 11px;
}

.cbox-msg-meta {
  display: flex;
  justify-content: space-between;
  color: #d23f77;
  font-weight: bold;
  margin-bottom: 3px;
  font-size: 10px;
}

.cbox-msg-time {
  color: #a85878;
  font-weight: normal;
}

.cbox-msg-text {
  color: #5c0e2e;
  word-break: break-word;
}

.cbox-inputs {
  display: flex;
  flex-direction: column;
  gap: 6px;
  border-top: 1px dashed #f0a3c2;
  padding-top: 8px;
}
