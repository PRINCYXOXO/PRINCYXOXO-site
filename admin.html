<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publisher Desk</title>
  <style>
    body {
      background-color: #fceef2;
      font-family: 'Georgia', serif;
      padding: 40px 20px;
      margin: 0;
    }
    .desk-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #f8c5d8; /* Light Pink Panel Background */
      border: 3px solid #d23f77;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    h3 {
      margin-top: 0;
      color: #d23f77;
      text-transform: uppercase;
      font-size: 18px;
      letter-spacing: 1px;
      border-bottom: 2px dashed #d23f77;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      color: #5c0e2e;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 20px;
      padding: 10px;
      font-family: inherit;
      font-size: 14px;
      background-color: #ffffff;
      color: #333333;
      border: 1px solid #d23f77;
    }
    button {
      background-color: #d23f77;
      color: white;
      border: none;
      padding: 12px;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      letter-spacing: 1px;
    }
    button:hover {
      background-color: #b02e60;
    }
  </style>
</head>
<body>

  <div class="desk-container">
    <h3>Publisher Desk</h3>
    
    <label>GitHub Access Token</label>
    <input id="pubToken" type="password" placeholder="Paste your ghp_ token here">

    <label>Gossip Headline / Target Name</label>
    <input id="pubTitle" type="text" placeholder="e.g., davey is dating hunter">

    <label>Scandalous Narrative</label>
    <textarea id="pubContent" rows="5" placeholder="Type your narrative here..."></textarea>
    
    <button onclick="publishLiveBlast()">Publish Live Blast</button>
  </div>

  <script>
    async function publishLiveBlast() {
      const token = document.getElementById('pubToken').value.trim();
      const title = document.getElementById('pubTitle').value.trim();
      const content = document.getElementById('pubContent').value.trim();
      
      if (!token || !title || !content) {
        alert("Please fill out all fields before launching a blast!");
        return;
      }

      const newPostHTML = `
        <!-- NEW POST -->
        <article>
          <h2>${title.toLowerCase()}</h2>
          <div class="file-under">Filed under: Live Feed > Exclusive > Blast</div>
          <p>${content}</p>
          <span class="signature">xoxo, PRINCYXOXO</span>
        </article>
      `;

      try {
        const url = `https://github.com`;
        const res = await fetch(url, { 
          headers: { 
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          } 
        });
        
        if (!res.ok) throw new Error("Connection failed! Your token key might be incorrect or expired.");
        const fileData = await res.json();
        
        let currentCode = decodeURIComponent(escape(atob(fileData.content)));
        const insertionPoint = '<section id="blastFeed">';
        currentCode = currentCode.replace(insertionPoint, insertionPoint + "\n" + newPostHTML);

        const updateRes = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `👑 Princy launched live blast: ${title}`,
            content: btoa(unescape(encodeURIComponent(currentCode))),
            sha: fileData.sha
          })
        });

        if (updateRes.ok) {
          alert("XOXO! Blast is officially live! Your site layout will refresh in 10 seconds.");
          document.getElementById('pubTitle').value = "";
          document.getElementById('pubContent').value = "";
        } else {
          alert("Failed to save changes back to GitHub. Check token clearance.");
        }
      } catch (err) {
        alert("Error: " + err.message);
      }
    }
  </script>
</body>
</html>
